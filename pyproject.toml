[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edte-rag-service"
version = "0.1.0"
description = "Semantic GraphRAG Engine for the Enterprise Digital Twin Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "neo4j>=5.25,<6.0",
    "pypdf>=5.0,<7.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.40,<2.0",
    "httpx>=0.27,<1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.7",
    "testcontainers[neo4j]>=4.8"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 88
target-version = "py311"